version: "3.9"

services:
  sass-rabbitmq:
    image: rabbitmq:3-management
    container_name: sass-rabbitmq-prod
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  sass-node-express:
    build:
      context: .
      dockerfile: Dockerfile.prod
    depends_on:
      sass-rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "4002:4000"
